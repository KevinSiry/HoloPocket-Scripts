# Un conteneur pour tous les comptes (fleet) et le panel qui les gère.
x-bot: &bot
  build: .
  image: holopocket-bot
  restart: unless-stopped
  init: true
  shm_size: "1gb"            # Chromium a besoin de mémoire partagée
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  networks: [internal]       # le panel joint l'API du bot (port 3100) sur ce réseau, jamais publié sur Internet

services:
  # Tous les comptes dans UN conteneur (un Chromium par compte). La liste des comptes, leurs identifiants et leurs réglages
  # viennent du panel : plus de fichier .env par compte. Réglages communs dans .env.shared.
  fleet:
    <<: *bot
    container_name: holopocket-fleet
    env_file: .env.shared
    environment:
      PANEL_URL: http://panel:8081   # liste des comptes fournie par le panel (réseau interne uniquement)
    shm_size: "3gb"                  # un Chromium par compte : prévois ~0,5 Go de mémoire par compte
    volumes:
      - ./data/fleet:/app/profile    # un sous-dossier par compte (session et mémoire des scripts)

  # Panel de gestion : une seule adresse pour voir et régler tous les comptes.
  # Lancer avec : docker compose --env-file .env.panel up -d --build
  panel:
    build: ../panel
    image: holopocket-panel
    container_name: holopocket-panel
    restart: unless-stopped
    init: true
    env_file: .env.panel
    environment:
      PANEL_TRUST_PROXY: "1"      # derrière Traefik : l'adresse du visiteur vient de X-Forwarded-For
      PANEL_FLEET_URL: http://fleet:3100
    depends_on: [fleet]
    volumes:
      - panel-data:/data         # réglage global du booster
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [internal, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # HTTP -> HTTPS
      - "traefik.http.routers.hp-panel.rule=Host(`${PANEL_DOMAIN}`)"
      - "traefik.http.routers.hp-panel.entrypoints=web"
      - "traefik.http.routers.hp-panel.middlewares=hp-panel-https"
      - "traefik.http.middlewares.hp-panel-https.redirectscheme.scheme=https"
      # HTTPS + certificat Let's Encrypt
      - "traefik.http.routers.hp-panel-secure.rule=Host(`${PANEL_DOMAIN}`)"
      - "traefik.http.routers.hp-panel-secure.entrypoints=websecure"
      - "traefik.http.routers.hp-panel-secure.tls=true"
      - "traefik.http.routers.hp-panel-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hp-panel-secure.middlewares=hp-panel-headers,hp-panel-ratelimit"
      - "traefik.http.routers.hp-panel-secure.service=hp-panel-svc"
      - "traefik.http.services.hp-panel-svc.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.hp-panel-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hp-panel-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.hp-panel-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.hp-panel-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.hp-panel-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.hp-panel-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.hp-panel-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.hp-panel-ratelimit.ratelimit.burst=60"

volumes:
  panel-data:

networks:
  internal:
  proxy:
    external: true   # réseau de Traefik, déjà créé sur le VPS (même nom que pour Kroniq)
